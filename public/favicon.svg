<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="vitalisGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="50%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#042f2e" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle container -->
  <rect width="512" height="512" rx="112" fill="url(#vitalisGrad)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-width="4" stroke-opacity="0.25"/>

  <!-- Pharmacy Cross -->
  <g filter="url(#shadow)">
    <rect x="216" y="116" width="80" height="280" rx="26" fill="#ffffff"/>
    <rect x="116" y="216" width="280" height="80" rx="26" fill="#ffffff"/>
  </g>

  <!-- Medicinal Leaf -->
  <g transform="translate(285, 260) rotate(16)">
    <path d="M 0,0 C 65,-45 130,-20 145,70 C 85,100 25,75 0,0 Z" fill="url(#leafGrad)" stroke="#15803d" stroke-width="3"/>
    <path d="M 4,4 Q 60,30 135,66" fill="none" stroke="#166534" stroke-width="5" stroke-linecap="round" stroke-opacity="0.75"/>
    <path d="M 40,20 Q 60,5 80,0" fill="none" stroke="#166534" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M 70,35 Q 100,28 115,18" fill="none" stroke="#166534" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6"/>
    <path d="M 50,25 Q 65,50 90,60" fill="none" stroke="#166534" stroke-width="3.5" stroke-linecap="round" stroke-opacity="0.6"/>
  </g>
</svg>